# Configuración para agregar al docker-compose.yml del servidor

# Agrega este servicio bajo la sección "services:" en el archivo docker-compose.yml del servidor:

# RamosCC - Sistema de opiniones de ramos DCC
    ramos:
        build: ./ramos/
        container_name: ramos
        restart: always
        depends_on:
            - caddy
        volumes:
            - ./ramos/data:/app/data           # Base de datos SQLite
            - ./ramos/logs:/app/logs           # Logs de la aplicación
            - ./ramos/staticfiles:/app/staticfiles  # Archivos estáticos
            - /etc/localtime:/etc/localtime:ro # Zona horaria
        environment:
            - VIRTUAL_HOST=ramos.cadcc.cl      # Dominio donde estará disponible
            - VIRTUAL_PORT=8000                # Puerto interno del contenedor
            - LETSENCRYPT_HOST=ramos.cadcc.cl  # Para certificado SSL automático
            - LETSENCRYPT_EMAIL=sistemas@cadcc.cl  # Email para Let's Encrypt
        networks:
            - proxy

# INSTRUCCIONES DE DESPLIEGUE:

# 1. Copia toda la carpeta de tu proyecto (ramosDCC) al servidor en la carpeta Docker/
# 2. Renombra la carpeta a "ramos" (Docker/ramos/)
# 3. Agrega el servicio anterior al archivo docker-compose.yml del servidor
# 4. En el servidor, ejecuta los siguientes comandos:
#    cd Docker
#    docker-compose build ramos
#    docker-compose up -d ramos

# 5. Para ver los logs:
#    docker-compose logs -f ramos

# 6. Para parar el servicio:
#    docker-compose stop ramos

# 7. Para actualizar la aplicación:
#    docker-compose stop ramos
#    docker-compose build ramos
#    docker-compose up -d ramos

# NOTAS IMPORTANTES:
# - Asegúrate de que el dominio ramos.cadcc.cl apunte al servidor
# - Los datos se guardarán en Docker/ramos/data/
# - Los logs estarán en Docker/ramos/logs/
# - Si necesitas acceso admin, puedes crear un superusuario ejecutando:
#   docker-compose exec ramos python manage.py createsuperuser --settings=ramosDcc.settings_production
