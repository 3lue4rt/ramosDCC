{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - ramosDCC</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body>
    <div class="color-bar">
        <div class="color1"></div>
        <div class="color2"></div>
        <div class="color3"></div>
        <div class="color4"></div>
        <div class="color5"></div>
        <div class="color6"></div>
    </div>
    <div class="logo-container">
        <img src="https://ramos.cadcc.cl/logo.png" alt="Logo ramosDCC" class="logo-img">
    </div>
    <h1>ramosDCC</h1>
    <p>Bienvenidx a ramosDCC, la plataforma ideal para organizar tu semestre</p>

    <div class="login-box">
        <h2>Inicia Sesión</h2>
        <form action="" name="iniciar-sesion-form" method="post">
            {% csrf_token %}
            <div>
                <label for="username">Nombre de usuario</label>
                <input type="text" name="username" id="username" required>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" required>
            </div>

            <button type="submit" name="login">Ingresar</button>
        </form>

        <button class="btn-outline" style="margin-top: 15px;" onclick="location.href='{% url 'courses_list' %}'">Ingresar como Invitado</button>

        <div class="text-center">
            <small>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></small>
        </div>
    </div>

</body>
</html>
